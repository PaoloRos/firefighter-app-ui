[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "firefighter-tools-backend"
version = "0.1.0"
description = "Local API backend for Feuerwehr Tools"
requires-python = ">=3.11"
dependencies = [
    "calendar-conversion @ git+https://github.com/PaoloRos/calendar-conversion.git@v0.2.0",
    "fastapi>=0.139,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx2>=2,<3",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
addopts = "--strict-markers -ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
